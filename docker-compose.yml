# Image names: by default the images are built on this host and tagged melorin/<name>:local. When MELORIN_IMAGE_REGISTRY is set in .env
# (e.g. ghcr.io/<owner>/melorin) scripts/deploy.sh pulls the images CI built for the exact commit (MELORIN_IMAGE_TAG=<sha>) instead of building.
name: melorin
# MEMORY BUDGET (audit W6): every service has a mem_limit; the caps add up to 3584 MiB (3.5 GiB). That is the ceiling the host must be
# able to honour, hence the 4 GB RAM recommendation in the README. scripts/check_ops_p0.py fails CI when a service has no cap or the
# sum goes over MEMORY_BUDGET_MIB; raise the README recommendation together with that constant.
services:
  postgres:
    restart: unless-stopped
    stop_grace_period: 30s
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: melorin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: melorin
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: [CMD-SHELL, 'pg_isready -U melorin -d melorin'], interval: 5s, timeout: 5s, retries: 10}
    networks: [backend]
    mem_limit: 768m
    cpus: 1.0
  redis:
    restart: unless-stopped
    image: redis:7-alpine
    # Bounded below the container cap so a runaway dataset gives Redis errors (rate limits fail closed, the DB outbox stays the
    # source of truth) instead of an OOM kill. noeviction: never silently drop queue or rate-limit keys.
    command: redis-server --appendonly yes --maxmemory 160mb --maxmemory-policy noeviction
    volumes: [redis_data:/data]
    healthcheck: {test: [CMD, redis-cli, ping], interval: 5s, timeout: 3s, retries: 10}
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
  api:
    restart: unless-stopped
    stop_grace_period: 30s
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/api:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    command: uvicorn melorin.app:app --host 0.0.0.0 --port 8000
    healthcheck: {test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/health/live", timeout=3)'], interval: 10s, timeout: 5s, retries: 12, start_period: 20s}
    volumes: [api_storage:/app/var]
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [backend]
    mem_limit: 768m
    cpus: 1.0
  worker:
    restart: unless-stopped
    stop_grace_period: 60s
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/api:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: [.env]
    command: arq melorin.worker.arq_app.WorkerSettings
    healthcheck: {test: [CMD, python, -c, 'import os, redis; r=redis.Redis.from_url(os.environ["MELORIN_REDIS_URL"]); raise SystemExit(0 if r.get("melorin:worker:last_tick") else 1)'], interval: 15s, timeout: 5s, retries: 8, start_period: 25s}
    volumes:
      - api_storage:/app/var
      - ./secrets/backup/recipients.txt:/run/melorin-backup/recipients.txt:ro
    depends_on: {postgres: {condition: service_healthy}, redis: {condition: service_healthy}}
    networks: [backend]
    mem_limit: 768m
    cpus: 1.0
  store_web:
    restart: unless-stopped
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/store-web:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/store-web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${MELORIN_GOOGLE_CLIENT_ID:-}
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, --quiet, http://127.0.0.1/], interval: 15s, timeout: 5s, retries: 8}
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
  admin_web:
    restart: unless-stopped
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/admin-web:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/admin-web/Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${MELORIN_GOOGLE_CLIENT_ID:-}
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, --quiet, http://127.0.0.1/], interval: 15s, timeout: 5s, retries: 8}
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
  telegram_main:
    restart: unless-stopped
    stop_grace_period: 30s
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/telegram-main:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/telegram-main/Dockerfile
    # Least privilege: NO env_file. A bot runner gets only what it needs (never the DB password, JWT/encryption keys, the other
    # runner's secret or the shared secret when its own is set). Core accepts MELORIN_MAIN_BOT_SECRET for the main store only.
    environment:
      MELORIN_CORE_URL: http://api:8000
      MELORIN_TELEGRAM_OFFSET_FILE: /var/lib/melorin/main-offset.json
      MELORIN_TELEGRAM_TOKEN: ${MELORIN_TELEGRAM_TOKEN:-}
      MELORIN_MAIN_BOT_SECRET: ${MELORIN_MAIN_BOT_SECRET:-}
      # the runner reads MELORIN_BOT_SERVICE_SECRET only as a fallback: it carries the main secret when that is set (so the shared
      # secret never enters this container) and the shared one only on installs that have not generated the per-runner secret yet
      MELORIN_BOT_SERVICE_SECRET: ${MELORIN_MAIN_BOT_SECRET:-${MELORIN_BOT_SERVICE_SECRET:-}}
      MELORIN_MAX_UPLOAD_BYTES: ${MELORIN_MAX_UPLOAD_BYTES:-5242880}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [telegram_main_state:/var/lib/melorin]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, scripts/telegram_healthcheck.py], interval: 30s, timeout: 8s, retries: 3, start_period: 15s}
    networks: [backend]
    mem_limit: 192m
    cpus: 0.5
  telegram_reseller:
    restart: unless-stopped
    stop_grace_period: 30s
    # Always on: it asks Core which reseller bots to run (admin → نمایندگان) and idles when there are none.
    image: ${MELORIN_IMAGE_REGISTRY:-melorin}/telegram-reseller:${MELORIN_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: apps/telegram-reseller/Dockerfile
    # Least privilege: NO env_file (see telegram_main). The reseller supervisor needs only its own secret; bot tokens come from Core.
    environment:
      MELORIN_CORE_URL: http://api:8000
      MELORIN_HEARTBEAT_FILE: /var/lib/melorin/supervisor-heartbeat
      MELORIN_RESELLER_BOT_SECRET: ${MELORIN_RESELLER_BOT_SECRET:-}
      # same fallback rule as telegram_main (own secret wins; shared secret only until the per-runner secret exists)
      MELORIN_BOT_SERVICE_SECRET: ${MELORIN_RESELLER_BOT_SECRET:-${MELORIN_BOT_SERVICE_SECRET:-}}
      # optional DEVELOPMENT overrides documented in .env.example (previously reached the container through env_file)
      MELORIN_RESELLER_BOTS_JSON: ${MELORIN_RESELLER_BOTS_JSON:-}
      MELORIN_TELEGRAM_RESELLER_TOKEN: ${MELORIN_TELEGRAM_RESELLER_TOKEN:-}
      MELORIN_STORE_SLUG: ${MELORIN_STORE_SLUG:-}
      MELORIN_MAX_UPLOAD_BYTES: ${MELORIN_MAX_UPLOAD_BYTES:-5242880}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: [telegram_reseller_state:/var/lib/melorin]
    depends_on: {api: {condition: service_healthy}}
    healthcheck: {test: [CMD, python, scripts/telegram_healthcheck.py], interval: 30s, timeout: 8s, retries: 3, start_period: 20s}
    networks: [backend]
    mem_limit: 256m   # one process, one long-poll loop per reseller bot
    cpus: 0.5
  caddy:
    restart: unless-stopped
    profiles: [local-proxy]
    image: caddy:2-alpine
    ports: ["80:80", "443:443"]
    environment:
      MELORIN_DOMAIN: ${MELORIN_DOMAIN:-localhost}
      MELORIN_ADMIN_DOMAIN: ${MELORIN_ADMIN_DOMAIN:-admin.localhost}
    volumes: [./infra/Caddyfile:/etc/caddy/Caddyfile:ro, caddy_data:/data, caddy_config:/config]
    depends_on:
      api: {condition: service_healthy}
      store_web: {condition: service_healthy}
      admin_web: {condition: service_healthy}
    healthcheck: {test: [CMD, wget, --spider, --quiet, http://127.0.0.1/health/live], interval: 15s, timeout: 5s, retries: 8}
    networks: [backend]
    mem_limit: 128m
    cpus: 0.5
  alertmanager:
    image: prom/alertmanager:v0.27.0
    restart: unless-stopped
    # Receivers come from .env (ALERT_TELEGRAM_* and/or ALERT_SMTP_*/ALERT_EMAIL_TO); see infra/alertmanager-entrypoint.sh
    environment:
      ALERT_TELEGRAM_BOT_TOKEN: ${ALERT_TELEGRAM_BOT_TOKEN:-}
      ALERT_TELEGRAM_CHAT_ID: ${ALERT_TELEGRAM_CHAT_ID:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_FROM: ${ALERT_SMTP_FROM:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    volumes:
      - ./infra/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager_data:/alertmanager
    healthcheck: {test: [CMD, wget, --spider, --quiet, http://127.0.0.1:9093/-/ready], interval: 15s, timeout: 5s, retries: 8}
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
  prometheus:
    restart: unless-stopped
    image: prom/prometheus:v3.15.1
    volumes:
      - ./infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./secrets/metrics-token:/etc/prometheus/metrics-token:ro
      - prometheus_data:/prometheus
    depends_on: {api: {condition: service_healthy}, alertmanager: {condition: service_healthy}}
    healthcheck: {test: [CMD, wget, --spider, --quiet, http://127.0.0.1:9090/-/ready], interval: 15s, timeout: 5s, retries: 8}
    networks: [backend]
    mem_limit: 256m
    cpus: 0.5
volumes:
  postgres_data: {}
  redis_data: {}
  api_storage: {}
  caddy_data: {}
  caddy_config: {}
  telegram_main_state: {}
  telegram_reseller_state: {}
  prometheus_data: {}
  alertmanager_data: {}
networks:
  backend:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
