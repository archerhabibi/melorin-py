[project]
name = "melorin-api"
version = "0.1.0"
description = "Melorin modular monolith Core API"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.143.0", "uvicorn[standard]==0.34.0", "sqlalchemy[asyncio]==2.0.36", "asyncpg==0.30.0", "aiosqlite==0.20.0",
  "alembic==1.14.0", "pydantic[email]==2.10.5", "pydantic-settings==2.7.1", "PyJWT==2.15.0",
  "cryptography==50.0.2", "httpx==0.28.1", "python-multipart==0.0.32", "redis==5.2.1", "arq==0.26.3", "segno==1.6.6"
]
[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E9", "F"]
ignore = ["F403", "F405"]
per-file-ignores = { "melorin/models.py" = ["F403", "F405"] }
[tool.ruff.format]
quote-style = "double"
line-ending = "lf"
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = ["integration: requires PostgreSQL/Redis or another external service", "concurrency: requires concurrent database sessions"]
# M6.10: a too-short HMAC key in a test must fail loudly instead of drowning the warning signal.
filterwarnings = ["error::jwt.warnings.InsecureKeyLengthWarning"]
[tool.coverage.run]
branch = true
source = ["melorin"]
omit = ["*/tests/*", "*/alembic/*"]
# Phase 4: SQLAlchemy's async layer runs on greenlets. Without this, coverage stops tracing the lines that follow an
# awaited DB call and under-reports every route/service module (e.g. identity/routes/sign_in.py read 58 % instead of 92 %).
concurrency = ["greenlet", "thread"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError"]

# Phase 3 - architecture contracts (run: `cd apps/api && lint-imports`). They fail CI when a dependency points the wrong way.
[tool.importlinter]
root_package = "melorin"
include_external_packages = false

[[tool.importlinter.contracts]]
name = "domain is pure (imports nothing of ours)"
type = "forbidden"
source_modules = ["melorin.domain"]
forbidden_modules = ["melorin.core", "melorin.kernel", "melorin.modules", "melorin.worker", "melorin.channels", "melorin.app", "melorin.cli"]

[[tool.importlinter.contracts]]
name = "kernel is the bottom layer"
type = "forbidden"
source_modules = ["melorin.kernel"]
forbidden_modules = ["melorin.core", "melorin.modules", "melorin.worker", "melorin.channels", "melorin.app", "melorin.cli"]

[[tool.importlinter.contracts]]
name = "core imports only kernel and domain"
type = "forbidden"
source_modules = ["melorin.core"]
forbidden_modules = ["melorin.modules", "melorin.worker", "melorin.channels", "melorin.app", "melorin.cli"]

[[tool.importlinter.contracts]]
name = "feature modules form an acyclic stack (a layer may import only layers below it)"
type = "layers"
layers = [
  "melorin.modules.admin",
  "melorin.modules.reports",
  "melorin.modules.reseller",
  "melorin.modules.orders | melorin.modules.payments | melorin.modules.identity",
  "melorin.modules.catalog | melorin.modules.referral | melorin.modules.tickets",
  "melorin.modules.vpn | melorin.modules.wallet | melorin.modules.webhooks | melorin.modules.notifications | melorin.modules.stores | melorin.modules.system",
]

[[tool.importlinter.contracts]]
name = "catalog.allocation is a one-way stack: offers <- routing <- sale (reseller_prices only needs offers)"
type = "layers"
layers = [
  "melorin.modules.catalog.allocation.sale | melorin.modules.catalog.allocation.reseller_prices",
  "melorin.modules.catalog.allocation.routing",
  "melorin.modules.catalog.allocation.offers",
]

[[tool.importlinter.contracts]]
name = "channels are adapters: they never import admin, reseller, reports, the worker or the entry points"
type = "forbidden"
source_modules = ["melorin.channels"]
forbidden_modules = ["melorin.modules.admin", "melorin.modules.reseller", "melorin.modules.reports", "melorin.worker", "melorin.app", "melorin.cli"]
