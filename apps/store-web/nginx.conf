# Keep asset caching at server scope so Nginx inherits security headers in /assets/.
map $uri $melorin_asset_cache_control {
  default "";
  ~^/assets/ "public, max-age=31536000, immutable";
}

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 6m;  # API enforces MELORIN_MAX_UPLOAD_BYTES (5 MB); nginx must not cut it at 1 MB (audit V-008)
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://accounts.google.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; script-src 'self' https://accounts.google.com/gsi/client; frame-src https://accounts.google.com/gsi/; font-src 'self' data:" always;
  add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
  add_header Cache-Control $melorin_asset_cache_control always;
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
  location /api/v1/internal/ { return 404; }
  location /api/ { proxy_pass http://api:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
}
