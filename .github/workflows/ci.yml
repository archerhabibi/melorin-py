name: CI
on:
  push:
  pull_request:
  workflow_dispatch:   # lets the Pin images workflow start CI for the pull request it opens
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_USER: melorin, POSTGRES_DB: melorin}
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      # runtime lock = what the image ships; dev lock = what CI runs
      - run: pip-audit -r requirements.txt
      - run: pip-audit -r requirements-dev.txt
      # a *.in file edited without re-locking would silently ship unpinned/unhashed dependencies
      - run: python -m pip install --disable-pip-version-check uv==0.11.32
      - run: bash scripts/lock_requirements.sh --check
        working-directory: .
      - run: python ../../scripts/preflight.py --runtime
      - run: python ../../scripts/verify_runtime.py
      - run: bash ../../scripts/check_secrets.sh
      - run: python ../../scripts/check_frontend_contracts.py
      - run: python ../../scripts/check_release_matrix.py
      - run: python ../../scripts/check_g001_g010.py
      - run: python ../../scripts/check_quality_config.py
      - run: python ../../scripts/gen_api_client.py --check
      - run: python ../../scripts/check_ops_p0.py
      - run: python ../../scripts/gen_docs.py --check
      - run: bash ../../scripts/test_deploy.sh
      - run: bash ../../scripts/test_restore_drill.sh
      - run: bash ../../scripts/run_quality_gate.sh
      - run: lint-imports
      - run: ruff check melorin --config pyproject.toml
      - run: mypy --config-file pyproject.toml  # T41/T-R09: type-checked packages are listed in pyproject.toml; mypy is hash-locked in requirements-dev.txt
      - run: ruff format --check melorin tests alembic --config pyproject.toml
      - run: python -m compileall -q melorin
      - run: pytest -q -n auto -m "not integration" --cov=melorin --cov-report=term-missing --cov-report=xml --cov-fail-under=75
        env: {MELORIN_DATABASE_URL: postgresql+asyncpg://melorin:test@localhost:5432/melorin, MELORIN_JWT_SECRET: ci-secret}
      - run: python ../../scripts/check_coverage_floors.py coverage.xml  # T39: higher floors for money-handling code
      - run: pytest -q -m integration
        env: {MELORIN_DATABASE_URL: postgresql+asyncpg://melorin:test@localhost:5432/melorin, MELORIN_REDIS_URL: redis://localhost:6379/0, MELORIN_JWT_SECRET: ci-secret-ci-secret-ci-secret-1234, MELORIN_ALLOW_MOCK_PROVIDERS: 'true'}
      - run: pytest -q ../telegram-main/tests
        env: {MELORIN_CORE_URL: 'http://core.invalid'}
      - run: pytest -q ../telegram-reseller/tests  # T-R3: this suite was never run by CI before
      - name: Compose files are valid (full stack and external-proxy variant)
        working-directory: .
        env: {POSTGRES_PASSWORD: ci-only}
        run: |
          cp .env.example .env
          docker compose --profile local-proxy -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.external.yml config -q
          rm -f .env
      - run: docker build -f apps/api/Dockerfile -t melorin-api .
        working-directory: .
      - run: python scripts/check_web_lockfiles.py
        working-directory: .
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: apps/store-web
      - run: npm audit --audit-level=high
        working-directory: apps/store-web
      - run: npm run lint
        working-directory: apps/store-web
      - run: npm run format:check
        working-directory: apps/store-web
      - run: npm test
        working-directory: apps/store-web
      - run: npm run build
        working-directory: apps/store-web
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: apps/admin-web
      - run: npm audit --audit-level=high
        working-directory: apps/admin-web
      - run: npm run lint
        working-directory: apps/admin-web
      - run: npm run format:check
        working-directory: apps/admin-web
      - run: npm test
        working-directory: apps/admin-web
      - run: npm run build
        working-directory: apps/admin-web
      - run: python scripts/check_bundle_budget.py
        working-directory: .
      # Generated API client: types must match the committed OpenAPI snapshot, compile, and pass unit tests.
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: packages/api-client
      - run: npm run generate && git diff --exit-code -- packages/api-client
        working-directory: packages/api-client
      - run: npm run typecheck
        working-directory: packages/api-client
      - run: npm test
        working-directory: packages/api-client
      - run: docker build -f apps/store-web/Dockerfile -t melorin-store-web .
        working-directory: .
      - run: docker build -f apps/admin-web/Dockerfile -t melorin-admin-web .
        working-directory: .
      - run: |
          # earlier test steps leave tables created without alembic_version; start from an empty schema
          python - <<'PY'
          import asyncio, os
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              e = create_async_engine(os.environ["MELORIN_DATABASE_URL"])
              async with e.begin() as c:
                  await c.execute(text("drop schema public cascade"))
                  await c.execute(text("create schema public"))
              await e.dispose()

          asyncio.run(main())
          PY
          alembic upgrade head
          alembic check
        env: {MELORIN_DATABASE_URL: postgresql+asyncpg://melorin:test@localhost:5432/melorin, MELORIN_JWT_SECRET: ci-secret}
      - run: bash ../../scripts/migration_smoke.sh
        env: {MELORIN_DATABASE_URL: postgresql+asyncpg://melorin:test@localhost:5432/melorin, MELORIN_JWT_SECRET: ci-secret}
      - run: |
          alembic upgrade head
          python -m melorin.cli bootstrap
          python ../../scripts/postgres_concurrency_smoke.py
          nohup uvicorn melorin.app:app --port 8000 > /tmp/api.log 2>&1 &
          nohup arq melorin.worker.arq_app.WorkerSettings > /tmp/worker.log 2>&1 &
          # /health/ready also needs the worker heartbeat; waiting only for /health/live raced with worker start-up
          for i in $(seq 1 60); do curl -sf localhost:8000/health/ready && break; sleep 1; done
          curl -sf localhost:8000/health/ready || { echo "API/worker not ready"; tail -n 30 /tmp/api.log /tmp/worker.log; exit 1; }
          python ../../scripts/e2e_smoke.py
        env: {MELORIN_DATABASE_URL: 'postgresql+asyncpg://melorin:test@localhost:5432/melorin', MELORIN_REDIS_URL: 'redis://localhost:6379/0', MELORIN_ALLOW_MOCK_PROVIDERS: 'true', MELORIN_BOOTSTRAP_ADMIN_EMAIL: admin@example.com, MELORIN_BOOTSTRAP_ADMIN_PASSWORD: 'Strong-admin-password-123456', MELORIN_BOOTSTRAP_ADMIN_TOTP_SECRET: JBSWY3DPEHPK3PXPJBSWY3DPEHPK3PXP, E2E_ADMIN_PASSWORD: 'Strong-admin-password-123456', MELORIN_JWT_SECRET: ci-secret-ci-secret-ci-secret-1234}

  web-e2e:
    # T42: browser E2E with a mocked Core API (e2e/). Non-blocking until the first green run on CI proves the specs.
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: apps/store-web
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
        working-directory: apps/admin-web
      - run: npm ci --no-audit --no-fund
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
        env: {CI: 'true'}
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: playwright-report, path: e2e/playwright-report}
  # T-R07: required on every PR (no continue-on-error): the unit/money-path suite again on a real PostgreSQL (private schema
  # per test), plus the concurrency tests SQLite cannot prove. Catches dialect-specific bugs such as M6.1.
  postgres-lane:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: test, POSTGRES_USER: melorin, POSTGRES_DB: melorin}
        ports: [5432:5432]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults: {run: {working-directory: apps/api}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install --require-hashes -r requirements-dev.txt
      - run: pytest -q -n auto -m "not integration"
        env: {TEST_PG_URL: 'postgresql+asyncpg://melorin:test@localhost:5432/melorin'}
