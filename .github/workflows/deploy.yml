name: Deploy
# Production deploys are gated by CI (audit W1): the only automatic trigger is a SUCCESSFUL "CI" run on a push to main,
# and the commit that was tested is exactly the commit that is deployed. A manual run re-checks that CI passed for the ref.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit/tag to deploy (must be on main and have a green CI run)
        required: false
        default: main

# Images (audit W6, opt-in): when the repository variable DEPLOY_IMAGE_REGISTRY is set (e.g. ghcr.io/<owner>/melorin), the "images"
# job builds the five images ONCE on a GitHub runner, tags them with the full commit sha and pushes them; the server then pulls
# exactly those images and never builds. Set MELORIN_IMAGE_REGISTRY to the same value in the server's .env to switch it on.
permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  prepare:
    # workflow_run fires for every CI completion; only a green push-triggered run on main may deploy.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve the commit to deploy
        id: sha
        env:
          EVENT: ${{ github.event_name }}
          RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_REF: ${{ github.event.inputs.ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            sha="$(git rev-parse "origin/${INPUT_REF:-main}^{commit}" 2>/dev/null || git rev-parse "${INPUT_REF:-main}^{commit}")"
          else
            sha="$RUN_SHA"
          fi
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $sha" >&2; exit 1; }
          git merge-base --is-ancestor "$sha" origin/main || { echo "$sha is not on main" >&2; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Require a green CI run for this exact commit
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.sha.outputs.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ci_ok() { [ "$(gh api "repos/${REPO}/actions/workflows/ci.yml/runs?head_sha=$1&status=success&per_page=1" --jq '.total_count')" -ge 1 ]; }
          if ci_ok "$SHA"; then exit 0; fi
          # The Changelog workflow pushes docs/CHANGE_LOG.md to main with GITHUB_TOKEN, and such pushes never start CI. Accept a
          # commit whose only difference from the nearest CI-green ancestor is that file (same code, same tests).
          for c in $(git rev-list --first-parent -n 10 "$SHA" | tail -n +2); do
            if ci_ok "$c"; then
              changed="$(git diff --name-only "$c" "$SHA")"
              if [ "$changed" = "docs/CHANGE_LOG.md" ]; then
                echo "CI is green for $c; $SHA only adds change-log entries"; exit 0
              fi
              break
            fi
          done
          echo "no successful CI run for $SHA; refusing to deploy" >&2; exit 1

  images:
    needs: prepare
    if: ${{ vars.DEPLOY_IMAGE_REGISTRY != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - {name: api, dockerfile: apps/api/Dockerfile}
          - {name: store-web, dockerfile: apps/store-web/Dockerfile}
          - {name: admin-web, dockerfile: apps/admin-web/Dockerfile}
          - {name: telegram-main, dockerfile: apps/telegram-main/Dockerfile}
          - {name: telegram-reseller, dockerfile: apps/telegram-reseller/Dockerfile}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - name: Log in to the registry
        env:
          REGISTRY: ${{ vars.DEPLOY_IMAGE_REGISTRY }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: printf '%s' "$TOKEN" | docker login "${REGISTRY%%/*}" -u "$ACTOR" --password-stdin
      - name: Build and push ${{ matrix.name }}
        env:
          REGISTRY: ${{ vars.DEPLOY_IMAGE_REGISTRY }}
          SHA: ${{ needs.prepare.outputs.sha }}
          NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          set -euo pipefail
          docker build -f "$DOCKERFILE" -t "$REGISTRY/$NAME:$SHA" .
          docker push "$REGISTRY/$NAME:$SHA"

  deploy:
    needs: [prepare, images]
    # images is skipped (registry mode off) or must have succeeded; a failed image build blocks the deploy.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && (needs.images.result == 'success' || needs.images.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Let the server pull from the registry (registry mode only)
        if: ${{ vars.DEPLOY_IMAGE_REGISTRY != '' }}
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          REGISTRY: ${{ vars.DEPLOY_IMAGE_REGISTRY }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          # The run's own short-lived token (read access to this repo's packages) is sent over the SSH channel on stdin: it is
          # never written to the runner log or a file, and it stops working when this workflow run ends.
          printf '%s' "$TOKEN" | ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o IdentitiesOnly=yes "$USER_NAME@$HOST" \
            "docker login '${REGISTRY%%/*}' -u '$ACTOR' --password-stdin >/dev/null"
      - name: Deploy (backup, migrate, health-check, automatic rollback)
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # The deploy script of the commit being deployed is streamed to the server (no copy to keep in sync, and the very
          # first deploy works before the server has scripts/deploy.sh). All logic, rollback included, lives in that script.
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o IdentitiesOnly=yes "$USER_NAME@$HOST" \
            "set -euo pipefail; cd /opt/melorin; git fetch --quiet --tags origin; git show ${SHA}:scripts/deploy.sh | APP_DIR=/opt/melorin bash -s -- --ref ${SHA}"
