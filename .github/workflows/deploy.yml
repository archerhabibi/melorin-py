name: Deploy
on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Deploy over SSH
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER_NAME: ${{ secrets.DEPLOY_USER }}
          PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o IdentitiesOnly=yes "$USER_NAME@$HOST" \
            'set -euo pipefail
             cd /opt/melorin
             git pull --ff-only
             REF=$(git rev-parse --short HEAD)
             trap '"'"'scripts/ops_log.sh -w github-actions -a deploy -b "previous deploy" -p "deploy FAILED at $REF" -c "see Actions run" -r "failed" -f "$REF"'"'"' ERR
             docker compose build
             docker compose run --rm api alembic upgrade head
             docker compose up -d
             docker image prune -f
             scripts/ops_log.sh -w github-actions -a deploy -b "previous deploy" -p "-" -c "git pull, build, migrate, up -d" -r "success" -f "$REF"'
