name: Changelog
# Fills docs/CHANGE_LOG.md automatically for every push to main, whoever pushed it.
# main is protected (pull request + required "quality" check), so the bot never pushes to it: it commits the new entries to
# the long-lived branch chore/changelog-auto and keeps ONE pull request open from it. Entries from several pushes pile up in
# that PR until it is merged (auto-merge is requested; otherwise merge it once CI is green).
on:
  push:
    branches: [main]
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: changelog
  cancel-in-progress: false
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare the changelog branch
        id: prep
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/changelog-auto
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          main_sha="$(git rev-parse HEAD)"
          open_pr="$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -n "$open_pr" ] && git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # a changelog PR is still waiting: keep its entries and bring it up to date with main
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            if ! git merge --no-edit -m "Merge main into $BRANCH [skip changelog]" "$main_sha"; then
              echo "::warning::merge with main conflicted; restarting the changelog branch from main"
              git merge --abort || true
              git checkout -B "$BRANCH" "$main_sha"
            fi
          else
            git checkout -B "$BRANCH" "$main_sha"
          fi
      - name: Generate entries for commits without one
        run: python3 scripts/changelog_auto.py --before "${{ github.event.before }}" --after "${{ github.sha }}"
      - name: Commit the log and open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/changelog-auto
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/CHANGE_LOG.md; then echo "no new entries"; exit 0; fi
          git add docs/CHANGE_LOG.md
          git commit -m "docs: auto change-log entries [skip changelog]"
          git push --force-with-lease origin "HEAD:refs/heads/$BRANCH" || git push --force origin "HEAD:refs/heads/$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --base main --state open --json number --jq '.[0].number // empty')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "docs: auto change-log entries [skip changelog]" \
              --body "Generated by the Changelog workflow (scripts/changelog_auto.py). Only docs/CHANGE_LOG.md changes; merge once CI is green."
          fi
          # Pull requests opened or updated with GITHUB_TOKEN do not start CI by themselves; workflow_dispatch is the exception.
          gh workflow run ci.yml --ref "$BRANCH"
          # Needs "Allow auto-merge" in the repository settings; harmless when it is off.
          gh pr merge "$BRANCH" --auto --squash --delete-branch || echo "auto-merge not available; merge the PR by hand once CI is green"
