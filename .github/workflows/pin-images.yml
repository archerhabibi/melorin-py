name: Pin images
# Pins every base image to an immutable digest (audit W17) and opens a pull request. It must run on a GitHub runner because
# digests come from the registries (Docker Hub, Quay...), which are not reachable from every development machine.
# Dependabot (docker + docker-compose ecosystems) keeps the pins current afterwards; run this again with "refresh" to move all
# of them to the tags' current digests at once.
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: Also move already pinned images to the tag's current digest
        type: boolean
        default: false
  schedule:
    - cron: "17 4 1 * *"   # monthly

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: pin-images
  cancel-in-progress: false

jobs:
  pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve digests and rewrite the references
        env:
          REFRESH: ${{ github.event_name == 'schedule' || inputs.refresh }}
        run: |
          set -euo pipefail
          args=(--pin)
          [ "$REFRESH" = "true" ] && args+=(--refresh)
          python3 scripts/pin_images.py "${args[@]}"
      - name: Open a pull request when something changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if git diff --quiet; then echo "every image is already pinned to the current digest"; exit 0; fi
          branch="chore/pin-images-$(date -u +%Y%m%d%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git commit -am "chore(images): pin base images by digest" \
            -m "Area: infra" -m "Action: scripts/pin_images.py rewrote name:tag to name:tag@sha256:<digest>."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "chore(images): pin base images by digest" \
            --body "Generated by the Pin images workflow (scripts/pin_images.py). Review the digests, merge once CI is green."
          # Pull requests opened with GITHUB_TOKEN do not start CI by themselves; workflow_dispatch is the exception.
          gh workflow run ci.yml --ref "$branch"
