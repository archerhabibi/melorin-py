global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/infra/alerts.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: melorin-api
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics-token
    static_configs:
      - targets: ["api:8000"]
  - job_name: melorin-worker
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics-token
    honor_labels: true # preserve each worker function's `job` label instead of overwriting it with the scrape job
    static_configs:
      - targets: ["worker:8001"]
  - job_name: melorin-backup
    metrics_path: /metrics
    bearer_token_file: /etc/prometheus/metrics-token
    honor_labels: true
    static_configs:
      - targets: ["backup:8001"]
